<title>SAJA MedLR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: enterprise workspace — fixed left navigation, a quiet top bar, and a single content column on a soft neutral ground. Green is reserved for action, selection and success. */
:root {
  --bg: #f6f7f6;
  --surface: #ffffff;
  --surface-2: #f2f4f3;
  --surface-3: #eaeeec;
  --line: #e2e7e4;
  --line-strong: #cfd7d3;
  --ink: #17201c;
  --ink-2: #47534d;
  --ink-3: #78837e;
  --accent: #17713d;
  --accent-hover: #125e33;
  --accent-soft: #e8f2ec;
  --accent-ink: #0f5a2f;
  --on-accent: #ffffff;
  --danger: #b4232c;
  --danger-soft: #fbeeee;
  --warn: #93600f;
  --warn-soft: #fbf3e4;
  --info: #35598f;
  --info-soft: #edf2f8;
  --senior: #22342b;
  --on-senior: #ffffff;
  --scrim: rgba(16, 24, 20, 0.42);
  --shadow-1: 0 1px 2px rgba(16, 24, 20, 0.05), 0 4px 14px rgba(16, 24, 20, 0.04);
  --shadow-2: 0 18px 48px rgba(16, 24, 20, 0.16);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- App shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 18px 14px 14px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; z-index: 30; }
.side .brand { display: flex; align-items: center; padding: 2px 6px 18px; border: 0; background: none; }
.side .brand img { height: 36px; width: auto; }
.nav-label { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; padding: 14px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--ink-2); font-weight: 600; text-align: left; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-ink); }
.nav-item .ico { color: var(--ink-3); }
.nav-item.active .ico { color: var(--accent); }
.nav-item .count { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 99px; background: var(--surface-3); color: var(--ink-2); font-size: 11px; font-weight: 700; text-align: center; }
.nav-item.active .count { background: var(--accent); color: var(--on-accent); }
.side .spacer { flex: 1; }
.side-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid var(--line); margin-top: 10px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1; max-width: 460px; }
.search input { width: 100%; height: 40px; padding: 0 14px 0 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.search .ico { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.search-pop { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-2); padding: 6px; max-height: 420px; overflow: auto; }
.search-pop .grp { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); padding: 8px 10px 4px; text-transform: uppercase; }
.search-pop button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.search-pop button:hover { background: var(--surface-2); }
.topbar .grow { flex: 1; }
.content { padding: 28px 28px 80px; max-width: 1360px; width: 100%; margin: 0 auto; }

/* ---------- Primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
.btn.icon { width: 38px; padding: 0; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 15px; height: 15px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.chip.plain::before { display: none; }
.chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.dim { background: var(--surface-3); color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); font-size: 11.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.sen { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.sen.senior { background: var(--senior); color: var(--on-senior); }
.sen.junior { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-strong); }
.avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); font-weight: 800; font-size: 11.5px; }
.avatar.lg { width: 52px; height: 52px; font-size: 17px; }
.avatar.sm { width: 24px; height: 24px; font-size: 9.5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.panel-head h3 { font-size: 15px; font-weight: 800; }
.panel-body { padding: 18px 20px; }
.section-title { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head .titles { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: 26px; font-weight: 800; }
.page-head .sub { color: var(--ink-2); max-width: 70ch; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.page-head h1 { max-width: 34ch; }
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--ink-3); font-weight: 600; }
.crumbs button:hover { color: var(--accent); text-decoration: underline; }
.crumbs .cur { color: var(--ink); font-weight: 700; }

.grid { display: grid; gap: 18px; }
.cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cols-main { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.between { justify-content: space-between; }

/* tables */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl .title { font-weight: 700; color: var(--ink); }
.cell-title { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.type-ico { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
.empty h4 { color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* toolbar & filters */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.field-inline { position: relative; }
.toolbar input[type=search], .toolbar select { height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 0 10px; font-size: 13px; }
.toolbar input[type=search] { min-width: 240px; padding-left: 34px; }
.toolbar .field-inline .ico { position: absolute; left: 11px; top: 9px; color: var(--ink-3); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-3); width: fit-content; max-width: 100%; overflow-x: auto; }
.tab { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.tab .n { font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-3); }
.tab.active .n { background: var(--accent); color: var(--on-accent); }

/* forms */
.form { display: grid; gap: 18px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.field .err { font-size: 12px; color: var(--danger); font-weight: 600; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 14px; }
.input, .select { height: 42px; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.invalid { border-color: var(--danger) !important; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 13px; }
.choice:hover { border-color: var(--ink-3); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.choice .box { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; background: var(--surface); }
.choice.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.type-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.type-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); text-align: left; }
.type-card:hover { border-color: var(--ink-3); }
.type-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.type-card b { display: block; font-size: 13.5px; }
.type-card span { font-size: 12px; color: var(--ink-3); }
.toggle { width: 38px; height: 22px; border-radius: 99px; border: 0; background: var(--line-strong); position: relative; padding: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 19px; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: var(--surface-3); }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* key-value */
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 16px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); font-weight: 600; }
.kv dd { margin: 0; font-weight: 600; min-width: 0; }

/* content block */
.claim { font-size: 19px; line-height: 1.55; font-weight: 600; color: var(--ink); max-width: 70ch; }
.ref { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.ref .n { width: 22px; height: 22px; flex: none; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 11px; }

/* workflow progress */
.wf { display: flex; flex-direction: column; gap: 0; }
.wf-step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.wf-step:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.wf-step.done:not(:last-child)::before { background: var(--accent); }
.wf-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink-3); font-size: 11px; font-weight: 800; }
.wf-step.done .wf-dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.wf-step.current .wf-dot { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 4px var(--surface-3); }
.wf-step .t { font-weight: 700; font-size: 13.5px; }
.wf-step .s { font-size: 12px; color: var(--ink-3); }
.wf-inline { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.wf-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.wf-pill .d { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-strong); }
.wf-pill.done { color: var(--accent-ink); }
.wf-pill.done .d { background: var(--accent); border-color: var(--accent); }
.wf-pill.current { color: var(--ink); }
.wf-pill.current .d { border-color: var(--ink); background: var(--surface); box-shadow: 0 0 0 3px var(--surface-3); }
.wf-sep { width: 14px; height: 2px; background: var(--line-strong); }

/* authority banner */
.authority { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; padding: 14px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.authority .lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.authority .v { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-top: 3px; }

/* comments / history */
.comment { padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.comment.junior { background: var(--surface-2); }
.comment .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.comment .who b { font-size: 13px; }
.timeline { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; position: relative; }
.tl-item:not(:last-child)::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 2px; width: 2px; background: var(--line); }
.tl-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.tl-ico.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tl-ico.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.tl-ico.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

/* banners */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.banner.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.banner.bad { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.banner.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.banner b { color: inherit; }
.banner .txt { flex: 1; min-width: 0; }
.banner .txt p { color: var(--ink-2); margin-top: 2px; font-size: 13px; }

/* lifecycle stepper */
.life { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.life-st { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 700; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.life-st.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.life-st.past { color: var(--accent-ink); border-color: transparent; background: var(--accent-soft); }
button.life-st:hover { border-color: var(--ink-3); }
.life-arrow { color: var(--ink-3); }

/* modal & drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: grid; place-items: center; padding: 20px; animation: fade .15s ease; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-2); animation: rise .2s ease; }
.modal.wide { width: min(760px, 100%); }
.modal-head { display: flex; gap: 14px; align-items: flex-start; padding: 22px 24px 0; }
.modal-head h2 { font-size: 20px; font-weight: 800; }
.modal-body { padding: 18px 24px; display: grid; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.m-ico { width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.m-ico.bad { background: var(--danger-soft); color: var(--danger); }
.m-ico.warn { background: var(--warn-soft); color: var(--warn); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }

#toasts, .toasts { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; gap: 10px; align-items: center; padding: 11px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 13.5px; box-shadow: var(--shadow-2); animation: rise .2s ease; max-width: min(560px, calc(100vw - 32px)); }

.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-2); z-index: 60; padding: 8px; max-height: 70vh; overflow: auto; }
.pop .grp { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); padding: 10px 10px 4px; text-transform: uppercase; }
.pop-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left; }
.pop-item:hover { background: var(--surface-2); }
.pop-item.on { background: var(--accent-soft); }
.rel { position: relative; }
.userbtn { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.userbtn .meta { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
.userbtn .meta b { font-size: 13px; }
.userbtn .meta span { font-size: 11.5px; color: var(--ink-3); }
.bell-dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid var(--surface); }

/* home */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.hello h1 { font-size: 28px; font-weight: 800; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.quick button { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); text-align: left; box-shadow: var(--shadow-1); }
.quick button:hover { border-color: var(--accent); }
.quick b { font-size: 14px; }
.quick span { font-size: 12.5px; color: var(--ink-3); }
.quick .qi { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.pipeline button { padding: 14px 16px; border: 0; border-right: 1px solid var(--line); background: none; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.pipeline button:last-child { border-right: 0; }
.pipeline button:hover { background: var(--surface-2); }
.pipeline b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pipeline span { font-size: 12px; color: var(--ink-3); font-weight: 600; }

.task { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.task:last-child { border-bottom: 0; }
.task:hover { background: var(--surface-2); }
.task .body { flex: 1; min-width: 0; }
.task .body b { display: block; font-size: 14px; }
.task .body span { font-size: 12.5px; color: var(--ink-3); }

/* assembly */
.assembly { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.lib-list { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow: auto; padding: 12px; }
.lib-item { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; }
.lib-item:hover:not(:disabled) { border-color: var(--accent); }
.lib-item:disabled { background: var(--surface-2); cursor: not-allowed; }
.lib-item .why { font-size: 11.5px; color: var(--danger); font-weight: 700; }
.canvas { background: var(--surface-3); border-radius: var(--r-lg); padding: 22px; min-height: 560px; }
.sheet { max-width: 620px; margin: 0 auto; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-1); border: 1px solid var(--line); overflow: hidden; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.sheet-head img { height: 22px; }
.block { position: relative; margin: 12px 16px; padding: 12px 14px 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.block.approved { border-left: 3px solid var(--accent); }
.block.new { border: 1px dashed var(--warn); border-left: 3px solid var(--warn); background: var(--warn-soft); }
.block .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.block .tools { margin-left: auto; display: flex; gap: 4px; text-transform: none; letter-spacing: 0; }
.block .tools button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-2); padding: 0; }
.block .tools button:hover { color: var(--ink); border-color: var(--ink-3); }
.block .txt { font-size: 14.5px; line-height: 1.55; }
.block.k-headline .txt { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.block.k-cta .txt { display: inline-block; padding: 9px 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 13.5px; }
.block.k-safety .txt { font-size: 12.5px; color: var(--ink-2); }
.block .checks { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); }
.block .checks .x { color: var(--danger); }
.drop-hint { margin: 16px; padding: 22px; border: 1.5px dashed var(--line-strong); border-radius: 10px; text-align: center; color: var(--ink-3); font-weight: 600; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.check-row .ok { color: var(--accent); }
.check-row .no { color: var(--danger); }

/* builder */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 26px 16px; background: var(--surface-2); border-radius: var(--r-lg); border: 1px solid var(--line); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
.flow-node { width: min(440px, 100%); display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; box-shadow: var(--shadow-1); }
.flow-node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.flow-node .idx { width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--ink-2); }
.flow-node .body { flex: 1; min-width: 0; }
.flow-node .body b { display: block; }
.flow-term { padding: 8px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 12.5px; display: inline-flex; gap: 8px; align-items: center; }
.flow-link { width: 2px; height: 22px; background: var(--line-strong); }
.flow-add { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); padding: 0; }
.flow-add:hover { border-color: var(--accent); color: var(--accent); }

/* login */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: var(--surface); }
.login-brand { position: relative; overflow: hidden; padding: 44px clamp(28px, 5vw, 64px); display: flex; flex-direction: column; gap: 32px; background: linear-gradient(160deg, #f7f9f8 0%, #eef3f0 100%); border-right: 1px solid var(--line); }
.login-brand::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--line-strong) 1px, transparent 1px); background-size: 22px 22px; opacity: .45; -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 70%, transparent); mask-image: linear-gradient(180deg, transparent, #000 40%, #000 70%, transparent); pointer-events: none; }
.login-brand::after { content: ""; position: absolute; width: 520px; height: 520px; right: -180px; bottom: -200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(23, 113, 61, .10), transparent); pointer-events: none; }
.login-brand > * { position: relative; z-index: 1; }
.login-logo { width: 176px; animation: fadeUp .5s ease both; }
.login-hero { display: flex; flex-direction: column; gap: 16px; animation: fadeUp .5s .08s ease both; }
.eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.login-brand h1 { font-size: clamp(34px, 3.6vw, 50px); line-height: 1.06; font-weight: 800; letter-spacing: -0.03em; }
.login-brand h1 em { font-style: normal; color: var(--accent); }
.login-brand .lede { font-size: 15.5px; color: var(--ink-2); max-width: 46ch; }
.login-preview { position: relative; max-width: 460px; padding-bottom: 34px; animation: fadeUp .5s .16s ease both; }
.lp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 50px rgba(16, 24, 20, .10), 0 2px 6px rgba(16, 24, 20, .05); padding: 16px; }
.lp-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.lp-ico { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.lp-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lp-title b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-title .mono { font-size: 11px; color: var(--ink-3); }
.lp-steps { display: grid; gap: 2px; padding-top: 10px; }
.lp-step { display: flex; align-items: center; gap: 10px; padding: 7px 4px; font-size: 13px; opacity: 0; animation: fadeUp .4s ease forwards; }
.lp-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.lp-dot svg { width: 13px; height: 13px; }
.lp-fn { font-weight: 700; min-width: 84px; }
.lp-who { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.lp-float { position: absolute; right: -18px; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 34px rgba(16, 24, 20, .12); animation: fadeUp .5s 1s ease both; }
.lp-float .lp-ico { background: var(--accent-soft); color: var(--accent); }
.lp-float b { display: block; font-size: 13px; }
.lp-float span span { font-size: 11.5px; color: var(--ink-3); }
.login-foot { margin-top: auto; font-size: 12px; color: var(--ink-3); }
.login-form { display: grid; place-items: center; padding: 40px 24px; background: var(--surface); }
.login-card { width: min(400px, 100%); display: grid; gap: 18px; animation: fadeUp .45s .1s ease both; }
.login-card h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.login-card .input { height: 46px; }
.login-div { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.login-div::before, .login-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.demo-accts { display: grid; gap: 6px; }
.demo-accts button { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; transition: border-color .15s, background .15s, transform .15s; }
.demo-accts button:hover { border-color: var(--accent); background: var(--surface-2); transform: translateY(-1px); }
.demo-accts button > svg:last-child { color: var(--ink-3); }
.da-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.da-txt b { font-size: 13px; }
.da-txt span { font-size: 12px; color: var(--ink-3); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* demo guide */
.guide-fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 99px; border: 0; background: var(--ink); color: var(--surface); font-weight: 800; box-shadow: var(--shadow-2); }
.guide { position: fixed; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 70; width: min(400px, calc(100vw - 40px)); max-height: min(640px, calc(100vh - 120px)); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-2); animation: rise .2s ease; }
.guide-head { padding: 16px 18px 10px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.guide-step { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.guide-step:last-child { border-bottom: 0; }
.guide-step .gd { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; border: 1.5px solid var(--line-strong); color: var(--ink-3); }
.guide-step.done .gd { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.guide-step.next { background: var(--accent-soft); }
.guide-step.next .gd { border-color: var(--accent); color: var(--accent); }
.guide-step b { display: block; font-size: 13px; }
.guide-step span { font-size: 11.5px; color: var(--ink-3); }

.success { text-align: center; padding: 34px 28px 10px; display: grid; gap: 12px; justify-items: center; }
.success .big { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.success .big .ico { width: 34px; height: 34px; }
.success h2 { font-size: 24px; font-weight: 800; }

.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 40px; gap: 12px; align-items: center; font-size: 13px; font-weight: 600; }
.bar-track { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--accent); }
.bar-fill.alt { background: var(--ink-3); }
.metric { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; }
.metric b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.metric span { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metrics > div + div { border-left: 1px solid var(--line); }

.disclaimer { font-size: 11.5px; color: var(--ink-3); text-align: center; padding: 18px; }
.hide-sm { }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .assembly { grid-template-columns: 260px minmax(0, 1fr); }
  .assembly .props { grid-column: 1 / -1; }
  .cols-main, .builder { grid-template-columns: minmax(0, 1fr); }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1024px) {
  .shell { grid-template-columns: 76px minmax(0, 1fr); }
  .topbar { padding: 10px 16px; }
  .content { padding: 20px 16px 80px; }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-brand { border-right: 0; border-bottom: 1px solid var(--line); padding: 32px 24px; }
  .login-brand h1 { font-size: 34px; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics > div:nth-child(3) { border-left: 0; }
}
@media (max-width: 760px) {
  .cols-2, .fgrid, .type-cards, .assembly { grid-template-columns: minmax(0, 1fr); }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .userbtn .meta { display: none; }
  .hide-sm { display: none !important; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .kv dd { margin-bottom: 8px; }
  .quick { grid-template-columns: minmax(0, 1fr); }
  .toolbar input[type=search] { min-width: 0; width: 100%; }
  .toolbar .field-inline { flex: 1 1 100%; }
}

/* ---------- Responsive refinements ---------- */
@media (max-width: 1024px) {
  .tbl th, .tbl td { padding-left: 10px; padding-right: 10px; }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-brand { border-right: 0; border-bottom: 1px solid var(--line); padding: 28px 24px 32px; gap: 22px; }
  .login-preview, .login-foot { display: none; }
  .login-brand h1 { font-size: 34px; }
  .login-form { padding: 32px 24px 48px; place-items: start center; }
}
@media (max-width: 820px) {
  .table-wrap { overflow: visible; }
  table.tbl, .tbl tbody { display: block; }
  .tbl thead { display: none; }
  .tbl tr { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 18px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .tbl tr:last-child { border-bottom: 0; }
  .tbl td, .tbl tr:last-child td { display: block; padding: 0; border: 0; min-width: 0; }
  .tbl td:first-child { flex: 1 1 100%; }
  .tbl td[data-label]:not(:first-child)::before { content: attr(data-label); display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
  .tbl td:empty { display: none; }
  .tbl tr.click:hover td { background: none; }
  .tbl tr.click:hover { background: var(--surface-2); }
}
@media (max-width: 760px) {
  .login-brand { padding: 22px 20px 24px; gap: 16px; }
  .login-logo { width: 132px; }
  .login-brand h1 { font-size: 28px; }
  .login-brand .lede { font-size: 14px; }
  .login-card h2 { font-size: 26px; }
  .login-form { padding: 24px 20px 40px; }
  .task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; row-gap: 6px; align-items: center; }
  .task > :first-child:not(.body) { grid-row: 1 / span 2; align-self: start; }
  .task .body { grid-column: 2; }
  .task > .chip { grid-column: 2; justify-self: start; }
  .task > svg:last-child { grid-column: 3; grid-row: 1 / span 2; }
  .task > .num { grid-column: 3; grid-row: 1; }
  .banner { flex-wrap: wrap; }
  .banner .txt { flex: 1 1 calc(100% - 40px); }
  .banner > .btn { margin-left: 34px; }
  .guide-fab { width: 48px; height: 48px; padding: 0; justify-content: center; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .guide-fab .lbl { display: none; }
  .guide { right: 12px; left: 12px; width: auto; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  .hello h1, .page-head h1 { font-size: 24px; }
  .content { padding: 18px 14px 88px; }
}

/* Navigation: icon rail on tablet, bottom bar on phone (no menu button) */
@media (max-width: 1024px) {
  .side { padding: 14px 10px; align-items: center; gap: 4px; }
  .side .brand { padding: 2px 0 14px; }
  .side .brand img { height: auto; width: 54px; }
  .nav-label { display: block; width: 32px; height: 1px; padding: 0; margin: 8px 0; background: var(--line); font-size: 0; }

}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: auto; left: 0; right: 0; bottom: 0; height: auto; flex-direction: row; align-items: stretch; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; z-index: 65; box-shadow: 0 -6px 20px rgba(16, 24, 20, .06); scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }

  .nav-label { width: 1px; height: auto; margin: 8px 4px; flex: none; }

  .nav-item .count { top: 2px; right: 10px; }
  .content { padding-bottom: 150px; }
  .guide-fab { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .guide { bottom: calc(138px + env(safe-area-inset-bottom, 0px)); max-height: calc(100vh - 210px); }
  #toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
}
@media (max-width: 760px) {
  .topbar .grow { display: none; }
  .topbar .search { max-width: none; }
}
@media (max-width: 760px) {
  .side .nav-label:first-of-type { display: none; }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .quick button { padding: 14px; }
  .quick button > span:last-child { font-size: 11.5px; }
}

/* =========================================================
   Elevated theme — layered shadows, soft gradients, glass
   ========================================================= */
:root {
  --line: #e6ebe8;
  --shadow-1: 0 1px 1px rgba(16, 24, 20, .03), 0 2px 4px rgba(16, 24, 20, .03), 0 10px 24px -10px rgba(16, 24, 20, .10);
  --shadow-2: 0 30px 70px -18px rgba(16, 24, 20, .28), 0 10px 24px -8px rgba(16, 24, 20, .10);
  --shadow-3: 0 2px 4px rgba(16, 24, 20, .04), 0 22px 44px -14px rgba(16, 24, 20, .22);
  --shadow-accent: 0 1px 0 rgba(255, 255, 255, .22) inset, 0 8px 20px -6px rgba(23, 113, 61, .55), 0 2px 4px rgba(23, 113, 61, .18);
  --grad-accent: linear-gradient(180deg, #1f8a4c 0%, #156a39 100%);
  --r-lg: 18px;
}
body {
  background:
    radial-gradient(1100px 520px at 105% -8%, rgba(23, 113, 61, .07), transparent 62%),
    radial-gradient(900px 480px at -8% -6%, rgba(53, 89, 143, .055), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}

/* glass chrome */
.side { background: rgba(255, 255, 255, .72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-right-color: rgba(16, 24, 20, .06); box-shadow: 1px 0 0 rgba(255, 255, 255, .6) inset, 8px 0 30px -18px rgba(16, 24, 20, .18); }
.topbar { background: rgba(250, 251, 250, .7); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom-color: rgba(16, 24, 20, .06); }
.nav-item { transition: background .15s, color .15s, transform .15s; }
.nav-item.active { background: linear-gradient(180deg, #ffffff, #f1f7f3); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(16, 24, 20, .06), 0 6px 16px -8px rgba(23, 113, 61, .35), 0 0 0 1px rgba(23, 113, 61, .14) inset; }
.nav-item.active::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item { position: relative; }
.search input { box-shadow: 0 1px 2px rgba(16, 24, 20, .04); transition: box-shadow .15s, border-color .15s; }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(23, 113, 61, .12); }
.userbtn { box-shadow: 0 1px 2px rgba(16, 24, 20, .05); }
.avatar { background: linear-gradient(145deg, #eef2f0, #dfe6e2); box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(16, 24, 20, .12); }

/* surfaces */
.panel { border-color: rgba(16, 24, 20, .07); box-shadow: var(--shadow-1); background: linear-gradient(180deg, #ffffff 0%, #fdfefd 100%); }
.panel-head { border-bottom-color: rgba(16, 24, 20, .06); }
.panel-head h3 { letter-spacing: -0.01em; }
.page-head h1, .hello h1 { letter-spacing: -0.025em; }
.page-head h1 { font-size: 28px; }

/* buttons */
.btn { transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease; box-shadow: 0 1px 2px rgba(16, 24, 20, .05); }
.btn:hover:not([disabled]) { transform: translateY(-1px); box-shadow: 0 6px 14px -6px rgba(16, 24, 20, .2); }
.btn:active:not([disabled]) { transform: translateY(0); }
.btn.primary { background: var(--grad-accent); border-color: #13633a; box-shadow: var(--shadow-accent); }
.btn.primary:hover:not([disabled]) { background: linear-gradient(180deg, #23955a 0%, #177340 100%); box-shadow: 0 1px 0 rgba(255, 255, 255, .22) inset, 0 12px 26px -8px rgba(23, 113, 61, .6), 0 2px 4px rgba(23, 113, 61, .2); }
.btn.ghost, .btn.ghost:hover:not([disabled]) { box-shadow: none; }
.input, .select, .textarea { box-shadow: 0 1px 2px rgba(16, 24, 20, .04); transition: box-shadow .15s, border-color .15s; }
.input:focus, .select:focus, .textarea:focus { box-shadow: 0 0 0 4px rgba(23, 113, 61, .12); }

/* home hero */
.hello { position: relative; overflow: hidden; padding: 26px 28px; border-radius: 22px; border: 1px solid rgba(16, 24, 20, .07); background: linear-gradient(120deg, #ffffff 0%, #f4f8f6 55%, #eaf3ee 100%); box-shadow: var(--shadow-1); }
.hello::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(16, 24, 20, .09) 1px, transparent 1px); background-size: 20px 20px; -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000 100%); mask-image: linear-gradient(90deg, transparent 35%, #000 100%); pointer-events: none; }
.hello::after { content: ""; position: absolute; width: 360px; height: 360px; right: -90px; top: -180px; border-radius: 50%; background: radial-gradient(closest-side, rgba(23, 113, 61, .14), transparent); pointer-events: none; }
.hello > * { position: relative; z-index: 1; }
.hello h1 { font-size: 30px; }

/* quick actions + clickable cards lift */
.quick button { border-color: rgba(16, 24, 20, .07); background: linear-gradient(180deg, #fff, #fbfcfb); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.quick button:hover { transform: translateY(-3px); box-shadow: var(--shadow-3); border-color: rgba(23, 113, 61, .35); }
.quick .qi { background: linear-gradient(145deg, #edf6f0, #d9ece0); box-shadow: 0 1px 0 #fff inset, 0 4px 10px -4px rgba(23, 113, 61, .35); }
.task { transition: background .15s; }
.tbl tr.click td { transition: background .15s; }
.metrics > div, .pipeline > * { transition: background .15s; }
.lib-item { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; box-shadow: 0 1px 2px rgba(16, 24, 20, .04); }
.lib-item:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-3); }
.lib-item[draggable="true"] { cursor: grab; }
.chip { box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset; }
.sen.senior { box-shadow: 0 2px 6px -2px rgba(34, 52, 43, .5); }

/* modals & pops */
.scrim { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); background: rgba(16, 24, 20, .32); }
.modal { box-shadow: 0 40px 100px -20px rgba(16, 24, 20, .4), 0 0 0 1px rgba(16, 24, 20, .06); border-radius: 22px; }
.pop, .search-pop { box-shadow: 0 24px 60px -16px rgba(16, 24, 20, .28), 0 0 0 1px rgba(16, 24, 20, .05); border-color: transparent; backdrop-filter: blur(16px); }
.toast { box-shadow: 0 18px 40px -12px rgba(16, 24, 20, .4); }
.guide-fab { background: linear-gradient(180deg, #2a3a32, #17201c); box-shadow: 0 1px 0 rgba(255, 255, 255, .12) inset, 0 16px 34px -10px rgba(16, 24, 20, .55); transition: transform .15s; }
.guide-fab:hover { transform: translateY(-2px); }
.guide { box-shadow: 0 40px 90px -24px rgba(16, 24, 20, .4), 0 0 0 1px rgba(16, 24, 20, .05); }

/* asset canvas */
.canvas { background: linear-gradient(180deg, #eef2f0, #e6ebe8); background-image: radial-gradient(rgba(16, 24, 20, .08) 1px, transparent 1px), linear-gradient(180deg, #eef2f0, #e7ece9); background-size: 18px 18px, auto; box-shadow: 0 1px 3px rgba(16, 24, 20, .06) inset; }
.sheet { border-radius: 14px; border-color: transparent; box-shadow: 0 2px 4px rgba(16, 24, 20, .05), 0 30px 60px -24px rgba(16, 24, 20, .3); transition: box-shadow .2s, outline-color .2s; outline: 2px dashed transparent; outline-offset: 6px; }
.block { transition: transform .15s ease, box-shadow .15s ease, opacity .15s; box-shadow: 0 1px 2px rgba(16, 24, 20, .04); }
.block[draggable="true"] { cursor: grab; }
.block[draggable="true"]:hover { box-shadow: 0 10px 24px -12px rgba(16, 24, 20, .3); transform: translateY(-1px); }
.grip { display: inline-grid; place-items: center; color: var(--ink-3); margin: -2px 0 0 -4px; cursor: grab; }
.drop-hint { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px 22px; border-radius: 14px; background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(23, 113, 61, .03) 10px 20px); }
.drop-hint .ico { width: 26px; height: 26px; color: var(--accent); }
.drop-hint b { color: var(--ink); }
.drop-hint span { font-size: 12.5px; font-weight: 500; }

/* drag states */
.dragging { opacity: .4; transform: scale(.98); }
body.drag-mod .sheet[data-drop], body.drag-blk .sheet[data-drop] { outline-color: rgba(23, 113, 61, .35); }
.sheet.drop-over { outline-color: var(--accent) !important; box-shadow: 0 0 0 8px rgba(23, 113, 61, .08), 0 30px 60px -24px rgba(16, 24, 20, .3); }
.sheet.drop-over .drop-hint { border-color: var(--accent); background: var(--accent-soft); }
.block.drop-before, .flow-node.drop-before { box-shadow: 0 -3px 0 0 var(--accent), 0 -10px 18px -10px rgba(23, 113, 61, .6); }
.block.drop-after, .flow-node.drop-after { box-shadow: 0 3px 0 0 var(--accent), 0 10px 18px -10px rgba(23, 113, 61, .6); }

/* workflow builder */
.flow { box-shadow: 0 1px 3px rgba(16, 24, 20, .05) inset; }
.flow-node { position: relative; cursor: grab; border-color: rgba(16, 24, 20, .07); background: linear-gradient(180deg, #fff, #fbfcfb); transition: transform .15s ease, box-shadow .15s ease, border-color .15s; box-shadow: 0 1px 2px rgba(16, 24, 20, .04), 0 8px 20px -12px rgba(16, 24, 20, .2); }
.flow-node:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); }
.flow-node.sel { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(23, 113, 61, .12), 0 14px 30px -14px rgba(23, 113, 61, .45); }
.flow-node .idx { background: linear-gradient(145deg, #f2f5f3, #e3e9e5); box-shadow: 0 1px 0 #fff inset; }
.flow-node.sel .idx { background: var(--grad-accent); color: #fff; box-shadow: var(--shadow-accent); }
.flow-term { box-shadow: var(--shadow-1); }
.flow-add { box-shadow: 0 2px 6px -2px rgba(16, 24, 20, .18); transition: transform .15s; }
.flow-add:hover { transform: scale(1.12); }

/* login polish */
.login-card .btn.primary { height: 48px !important; border-radius: 12px; font-size: 14.5px; }
.demo-accts button { box-shadow: 0 1px 2px rgba(16, 24, 20, .04); }
.demo-accts button:hover { box-shadow: var(--shadow-3); }

@media (max-width: 760px) {
  .hello { padding: 20px; border-radius: 18px; }
  .hello h1 { font-size: 24px; }
  .side { background: rgba(255, 255, 255, .86); box-shadow: 0 -10px 30px -12px rgba(16, 24, 20, .2); }
  .nav-item.active::before { left: 50%; top: -6px; bottom: auto; width: 24px; height: 3px; transform: translateX(-50%); border-radius: 0 0 3px 3px; }
}
@media (max-width: 1024px) and (min-width: 761px) {
  .nav-item.active::before { left: -10px; }
}
.sheet .drop-hint { min-height: 220px; justify-content: center; }

/* ---------- Step-by-step forms ---------- */
.wiz { margin-bottom: 20px; padding: 14px 16px 0; background: linear-gradient(180deg, #fff, #fbfcfb); border: 1px solid rgba(16, 24, 20, .07); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.wiz ol { list-style: none; margin: 0; padding: 0 0 12px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.wiz ol::-webkit-scrollbar { display: none; }
.wiz li { flex: 1 1 0; min-width: max-content; display: flex; align-items: center; }
.wiz li:not(:last-child)::after { content: ""; flex: 1; min-width: 16px; height: 2px; margin: 0 6px; border-radius: 2px; background: var(--line); }
.wiz li.done:not(:last-child)::after { background: var(--accent); }
.wiz button { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border: 0; border-radius: 12px; background: none; color: var(--ink-3); font-weight: 700; font-size: 13px; white-space: nowrap; transition: background .15s, color .15s; }
.wiz button:not(:disabled):hover { background: var(--surface-2); color: var(--ink); }
.wiz button:disabled { cursor: default; opacity: .7; }
.wiz .n { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink-2); }
.wiz .n .ico { width: 14px; height: 14px; }
.wiz li.done button { color: var(--ink-2); }
.wiz li.done .n { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.wiz li.cur button { color: var(--ink); }
.wiz li.cur .n { background: var(--grad-accent); border-color: transparent; color: #fff; box-shadow: var(--shadow-accent); }
.wiz-meter { height: 3px; margin: 0 -16px; background: var(--surface-3); }
.wiz-meter span { display: block; height: 100%; background: var(--grad-accent); border-radius: 0 3px 3px 0; transition: width .35s ease; }
.wiz-head { display: flex; flex-direction: column; gap: 4px; padding: 2px 2px 4px; }
.wiz-anim .wiz-head, .wiz-anim section.panel:not([hidden]) { animation: fadeUp .3s ease both; }
.panel-head .grow { flex: 1; }
.wiz-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; outline: none; }
.wiz-foot { position: sticky; bottom: 12px; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(16, 24, 20, .07); box-shadow: 0 16px 40px -18px rgba(16, 24, 20, .35); }
.wiz-foot .grow { flex: 1; }
.wiz-foot .btn { height: 42px; padding: 0 18px; }
.wiz-foot .btn.primary { min-width: 130px; }
.panel.sum .panel-head { padding-top: 12px; padding-bottom: 12px; }
.panel.sum dd { white-space: pre-line; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .wiz { padding: 10px 10px 0; }
  .wiz li:not(.cur) .l { display: none; }
  .wiz-meter { margin: 0 -10px; }
  .wiz-head h2 { font-size: 20px; }
  .wiz-foot { bottom: 80px; }
  .panel.sum .kv { grid-template-columns: minmax(0, 1fr) !important; }
}

/* ---------- Review-flow icons ---------- */
.fn-badge { width: 22px; height: 22px; flex: none; border-radius: 7px; display: inline-grid; place-items: center; background: linear-gradient(145deg, #f3f6f4, #e4eae6); color: var(--ink-2); box-shadow: 0 1px 0 #fff inset, 0 1px 2px rgba(16, 24, 20, .08); }
.fn-badge .ico { width: 13px; height: 13px; }
.fn-badge.sm { width: 20px; height: 20px; border-radius: 6px; margin-right: 6px; vertical-align: -5px; }
.fn-badge.lg { width: 36px; height: 36px; border-radius: 11px; }
.fn-badge.lg .ico { width: 18px; height: 18px; }
.fn-medical { color: #17713d; }
.fn-legal { color: #35598f; }
.fn-regulatory { color: #7a5a14; }
.wf-pill { padding: 3px 9px 3px 3px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.wf-pill.done { background: var(--accent-soft); border-color: transparent; }
.wf-pill.done .fn-badge { background: var(--grad-accent); color: #fff; box-shadow: none; }
.wf-pill.current { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--surface-3); }
.wf-step .t { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.wf-step .t .fn-badge.sm { margin-right: 2px; }

/* flow diagram (horizontal) */
.flowx { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding: 6px 2px 10px; }
.fx-node, .fx-term { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 14px 12px; min-width: 120px; border-radius: 16px; background: linear-gradient(180deg, #fff, #f9fbfa); border: 1px solid rgba(16, 24, 20, .08); box-shadow: 0 1px 2px rgba(16, 24, 20, .04), 0 12px 24px -14px rgba(16, 24, 20, .3); text-align: center; }
.fx-node b { font-size: 13px; }
.fx-node > span:not(.fn-badge):not(.sen) { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.fx-node.final { border-color: rgba(23, 113, 61, .3); box-shadow: 0 0 0 3px rgba(23, 113, 61, .08), 0 12px 24px -14px rgba(23, 113, 61, .45); }
.fx-term { min-width: 96px; flex-direction: row; gap: 8px; border-radius: 99px; padding: 10px 14px; align-self: center; font-weight: 700; font-size: 12.5px; color: var(--ink-2); }
.fx-term.ok { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
.fx-arrow { flex: none; align-self: center; color: var(--ink-3); }

/* new workflow step editor */
.nwf-list { display: flex; flex-direction: column; align-items: stretch; }
.nwf-link { display: block; width: 2px; height: 14px; margin-left: 31px; background: var(--line-strong); }
.nwf-step { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid rgba(16, 24, 20, .08); background: linear-gradient(180deg, #fff, #fbfcfb); box-shadow: 0 1px 2px rgba(16, 24, 20, .04), 0 10px 22px -14px rgba(16, 24, 20, .28); }
.nwf-step .idx { width: 24px; height: 24px; flex: none; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: 11.5px; color: var(--ink-2); }
.nwf-fields { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nwf-fields .select { width: auto; min-width: 210px; flex: 1 1 210px; height: 38px; }
.nwf-tools { display: flex; gap: 4px; }
.nwf-add { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.nwf-add .btn { gap: 8px; padding-left: 6px; }
@media (max-width: 760px) {
  .nwf-step { flex-wrap: wrap; }
  .nwf-fields { flex: 1 1 100%; order: 3; }
  .nwf-tools { margin-left: auto; }
  .nwf-fields .select { min-width: 0; flex-basis: 100%; }
}

/* ---------- Login: centred form + motion ---------- */
.login-form { min-height: 100vh; align-content: center; justify-items: center; }
.login-card { justify-items: stretch; }
.login-title { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.login-mark { width: 52px; height: 52px; margin-bottom: 6px; border-radius: 16px; display: grid; place-items: center; background: var(--grad-accent); color: #fff; box-shadow: var(--shadow-accent); animation: popIn .6s .15s cubic-bezier(.2, .9, .3, 1.4) both, glow 3.2s 1s ease-in-out infinite; }
.login-mark .ico { width: 24px; height: 24px; }
.login-div, .login-card > p.muted { text-align: center; justify-content: center; }
.login-card > * { animation: fadeUp .5s ease both; }
.login-card > *:nth-child(1) { animation-delay: .05s; } .login-card > *:nth-child(2) { animation-delay: .12s; } .login-card > *:nth-child(3) { animation-delay: .19s; }
.login-card > *:nth-child(4) { animation-delay: .26s; } .login-card > *:nth-child(5) { animation-delay: .33s; } .login-card > *:nth-child(6) { animation-delay: .4s; } .login-card > *:nth-child(7) { animation-delay: .47s; }
.login-card .btn.primary { position: relative; overflow: hidden; }
.login-card .btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent); transform: skewX(-18deg); animation: shine 3.6s 1.4s ease-in-out infinite; }
.demo-accts button { animation: fadeUp .4s ease both; }
.demo-accts button:nth-child(1) { animation-delay: .5s; } .demo-accts button:nth-child(2) { animation-delay: .57s; } .demo-accts button:nth-child(3) { animation-delay: .64s; } .demo-accts button:nth-child(4) { animation-delay: .71s; } .demo-accts button:nth-child(5) { animation-delay: .78s; }
/* brand side motion */
.login-brand .blob { position: absolute; z-index: 0; border-radius: 50%; filter: blur(10px); pointer-events: none; }
.login-brand .b1 { width: 380px; height: 380px; left: -120px; top: 30%; background: radial-gradient(closest-side, rgba(23, 113, 61, .13), transparent); animation: drift 14s ease-in-out infinite alternate; }
.login-brand .b2 { width: 300px; height: 300px; right: -60px; top: -80px; background: radial-gradient(closest-side, rgba(53, 89, 143, .10), transparent); animation: drift 18s ease-in-out infinite alternate-reverse; }
.login-brand h1 em { background: linear-gradient(90deg, #17713d, #2aa564, #17713d); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 6s linear infinite; }
.lp-card { animation: float 6s 1.4s ease-in-out infinite; }
.lp-float { animation: fadeUp .5s 1.7s ease both, float 5s 2.2s ease-in-out infinite reverse; }
.lp-steps { position: relative; }
.lp-rail { position: absolute; left: 14px; top: 22px; bottom: 22px; width: 2px; background: var(--accent); transform-origin: top; transform: scaleY(0); animation: rail 1.4s .4s ease forwards; border-radius: 2px; opacity: .5; }
.lp-dot { position: relative; z-index: 1; }
.lp-step .lp-dot { animation: popIn .45s cubic-bezier(.2, .9, .3, 1.4) both; animation-delay: inherit; }
.lp-approved { animation: popIn .5s 1.75s cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, -40px) scale(1.15); } }
@keyframes sheen { to { background-position: -200% 0; } }
@keyframes shine { 0% { left: -60%; } 30%, 100% { left: 130%; } }
@keyframes rail { to { transform: scaleY(1); } }
@keyframes glow { 0%, 100% { box-shadow: var(--shadow-accent); } 50% { box-shadow: 0 1px 0 rgba(255, 255, 255, .22) inset, 0 10px 30px -4px rgba(23, 113, 61, .6), 0 0 0 6px rgba(23, 113, 61, .08); } }
.login-form { position: relative; overflow: hidden; }
.login-form::before { content: ""; position: absolute; width: 520px; height: 520px; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(23, 113, 61, .05), transparent); pointer-events: none; }
.login-card { position: relative; z-index: 1; }
@media (max-width: 1024px) { .login-form { min-height: 0; align-content: start; } }

/* ---------- Pagination ---------- */

  return usedInApproved(m.id) ? 'Active' : 'Approved';
}
const usedInApproved = id => S.assets.some(a => a.status === 'Approved' && a.blocks.some(b => b.moduleId === id));
const STATUS_TONE = { 'Draft': 'dim', 'In Review': 'info', 'Awaiting Senior submit': 'info', 'Changes Requested': 'warn', 'Approved': 'ok', 'Active': 'ok', 'Expiring': 'warn', 'Review Required': 'bad', 'Superseded': 'dim', 'Archived': 'dim', 'Rejected': 'bad', 'Re-approval required': 'warn' };
const chip = (s, extra = '') => `<span class="chip ${STATUS_TONE[s] || ''}">${esc(s)}${extra}</span>`;
const sen = s => s ? `<span class="sen ${s === 'Senior' ? 'senior' : 'junior'}">${s === 'Senior' ? icon('shield', 'sm') : ''}${s}</span>` : '';
const avatar = (u, cls = '') => `<span class="avatar ${cls}" aria-hidden="true">${esc(initials(u.name))}</span>`;

function impactedAssets(m) {
  const lv = live(m); if (!lv) return [];
  return S.assets.filter(a => a.blocks.some(b => b.moduleId === m.id && b.v < lv.v));
}
function eligibility(m, a) {
  const lv = live(m);
  const checks = [
    ['Approved', !!lv && !m.archived],
    [market(a.market).name + ' eligible', m.markets.includes(a.market)],
    [a.channel + ' channel', m.channels.includes(a.channel)],
    ['Not expired', !(m.expiry && m.expiry < Date.now())]
  ];
  const prodOk = m.product === a.product;
  return { ok: prodOk && checks.every(c => c[1]), checks, prodOk, reason: !prodOk ? 'Different product' : (checks.find(c => !c[1]) || [''])[0] };
}

/* workflow engine */
function stepLabel(st) { return st.fn + ' · ' + (st.req === 'approve' ? (st.seniority + ' approval') : (st.seniority + ' review')); }
function curStep(obj) { if (!obj.review) return null; const wf = wfById(obj.review.wf); return wf.steps[obj.review.step] || null; }
function assigneeFor(st) { return S.users.filter(u => u.status === 'Active' && u.type === REVIEWER_OF[st.fn] && u.seniority === st.seniority); }
function canActOn(u, obj) { const st = curStep(obj); return !!st && u.type === REVIEWER_OF[st.fn] && u.seniority === st.seniority; }
function nextLabel(obj) {
  const wf = wfById(obj.review.wf); const st = wf.steps[obj.review.step]; const nx = wf.steps[obj.review.step + 1];
  if (!nx) return 'Complete review';
  if (nx.fn === st.fn && nx.seniority === 'Senior') return 'Send to Senior';
  return 'Send to ' + nx.fn;
}
function juniorStepIndex(obj) { const wf = wfById(obj.review.wf); const st = curStep(obj); for (let i = obj.review.step - 1; i >= 0; i--) if (wf.steps[i].fn === st.fn && wf.steps[i].seniority === 'Junior') return i; return -1; }

function log(action, objType, objId, version, note) { S.audit.push({ id: uid('a'), ts: Date.now(), user: S.personaId, action, objType, objId, version, note: note || '' }); }

function submitModule(m) {
  const u = me(); const l = latest(m);
  if (u.type === 'Content Owner' && u.seniority === 'Junior') {
    l.status = 'Awaiting Senior submit'; log('Sent to Senior Content Owner for submission', 'Module', m.id, l.v); save();
    return 'sent-senior';
  }
  m.review = { wf: 'WF-STD', step: 0, submittedAt: Date.now(), comments: [] };
  l.status = 'In Review'; m.changes = null; m.updatedAt = Date.now();
  log(l.v > 1 && m.versions.some(v => v.status === 'Approved' || v.status === 'Superseded') ? 'Submitted for re-approval' : 'Submitted for review', 'Module', m.id, l.v);
  save(); return 'in-review';
}
function decide(obj, kind, decision, note) {
  const isMod = kind === 'Module';
  const wf = wfById(obj.review.wf); const st = curStep(obj);
  const v = isMod ? latest(obj).v : 1;
  const push = d => obj.review.comments.push({ by: S.personaId, at: Date.now(), text: note || '', decision: d, step: obj.review.step, fn: st.fn, seniority: st.seniority });
  if (decision === 'send') {
    const lbl = nextLabel(obj); push(lbl); log(lbl, kind, obj.id, v, note);
    obj.review.step++; save(); return { done: false, msg: lbl === 'Send to Senior' ? 'Sent to Senior ' + st.fn + ' Reviewer' : 'Review completed — moved to ' + (wf.steps[obj.review.step] ? stepLabel(wf.steps[obj.review.step]) : 'approval') };
  }
  if (decision === 'approve') {
    push('Final ' + st.fn + ' approval'); log('Final ' + st.fn + ' approval', kind, obj.id, v, note);
    obj.review.step++;
    if (obj.review.step >= wf.steps.length) {
      if (isMod) {
        const l = latest(obj); const prev = live(obj);
        if (prev && prev !== l) { prev.status = 'Superseded'; log('Version superseded', 'Module', obj.id, prev.v, 'Replaced by v' + l.v); }
        l.status = 'Approved'; l.approvedAt = Date.now(); l.by = S.personaId; l.history = obj.review.comments; obj.review = null; obj.updatedAt = Date.now();
        log('Module approved', 'Module', obj.id, l.v, 'Available in the Approved Content Library');
      } else {
        obj.status = 'Approved'; obj.approvedAt = Date.now(); obj.history = obj.review.comments; obj.review = null;
        obj.blocks.forEach(b => { if (b.kind === 'new') b.approved = true; });
        log('Asset approved', 'Asset', obj.id, 1);
      }
      save(); return { done: true };
    }
    save(); return { done: false, msg: 'Final ' + st.fn + ' approval recorded — moved to ' + stepLabel(wf.steps[obj.review.step]) };
  }
  if (decision === 'return') {
    const j = juniorStepIndex(obj); push('Returned to Junior'); log('Returned to Junior', kind, obj.id, v, note);
    obj.review.step = j; save(); return { done: false, msg: 'Returned to Junior ' + st.fn + ' Reviewer' };
  }
  if (decision === 'changes' || decision === 'reject') {
    const lbl = decision === 'changes' ? 'Requested changes' : 'Rejected';
    push(lbl); log(lbl, kind, obj.id, v, note);
    if (isMod) { const l = latest(obj); l.status = decision === 'changes' ? 'Changes Requested' : 'Rejected'; l.lastReview = obj.review.comments; obj.changes = note; obj.review = null; }
    else { obj.status = decision === 'changes' ? 'Changes Requested' : 'Rejected'; obj.lastReview = obj.review.comments; obj.changes = note; obj.review = null; }
    save(); return { done: false, msg: decision === 'changes' ? 'Changes requested — sent back to the owner' : 'Rejected' };
  }
}

/* tasks for a persona */
function tasksFor(u) {
  const out = [];
  S.modules.forEach(m => {
    if (m.review && canActOn(u, m)) { const st = curStep(m); out.push({ kind: 'review', obj: m, type: 'Module', title: m.title, id: m.id, step: st, since: m.review.comments.length ? m.review.comments[m.review.comments.length - 1].at : m.review.submittedAt }); }
    const l = latest(m);
    if (u.type === 'Content Owner') {
      if (l.status === 'Changes Requested' && m.owner === u.id) out.push({ kind: 'revise', obj: m, type: 'Module', title: m.title, id: m.id, since: m.updatedAt });
      if (l.status === 'Awaiting Senior submit' && u.seniority === 'Senior') out.push({ kind: 'submit', obj: m, type: 'Module', title: m.title, id: m.id, since: m.updatedAt });
      if (l.status === 'Draft' && m.owner === u.id) out.push({ kind: 'draft', obj: m, type: 'Module', title: m.title, id: m.id, since: m.updatedAt });
    }
  });
  S.assets.forEach(a => {
    if (a.review && canActOn(u, a)) { const st = curStep(a); out.push({ kind: 'review', obj: a, type: 'Asset', title: a.name, id: a.id, step: st, since: a.review.submittedAt }); }
    if (u.type === 'Marketing User' || u.type === 'Content Owner') {
      if (a.status === 'Changes Requested' && a.owner === u.id) out.push({ kind: 'revise', obj: a, type: 'Asset', title: a.name, id: a.id, since: a.createdAt });
      if (a.status === 'Awaiting Senior submit' && u.type === 'Marketing User' && u.seniority === 'Senior') out.push({ kind: 'submit', obj: a, type: 'Asset', title: a.name, id: a.id, since: a.createdAt });
    }
  });
  if (u.type === 'Content Owner' && u.seniority === 'Senior') S.modules.forEach(m => { if (lifeStatus(m) === 'Expiring' || lifeStatus(m) === 'Review Required') out.push({ kind: 'expiry', obj: m, type: 'Module', title: m.title, id: m.id, since: m.expiry }); });
  return out;
}

const goAttr = (name, id, extra = '') => `data-go="${name}"${id ? ` data-id="${esc(id)}"` : ''}${extra}`;
const crumbs = list => `<nav class="crumbs" aria-label="Breadcrumb">${list.map((c, i) => i === list.length - 1 ? `<span class="cur">${esc(c[0])}</span>` : `<button ${goAttr(c[1], c[2])}>${esc(c[0])}</button>${icon('chevron', 'sm')}`).join('')}</nav>`;
const pageHead = (title, sub, actions = '', cr = null) => `<header class="page-head"><div class="titles">${cr ? crumbs(cr) : ''}<h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</header>`;
const btn = (label, act, cls = '', attrs = '', ic = '') => `<button class="btn ${cls}" data-act="${act}" ${attrs}>${ic ? icon(ic, 'sm') : ''}${esc(label)}</button>`;
const goBtn = (label, name, id, cls = '', ic = '', extra = '') => `<button class="btn ${cls}" ${goAttr(name, id, extra)}>${ic ? icon(ic, 'sm') : ''}${esc(label)}</button>`;
const opt = (v, cur, label) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(label == null ? v : label)}</option>`;
const sel = (key, cur, options, allLabel) => `<select aria-label="${esc(allLabel)}" data-filter="${key}">${opt('', cur, allLabel)}${options.map(o => Array.isArray(o) ? opt(o[0], cur, o[1]) : opt(o, cur)).join('')}</select>`;
const searchBox = (key, cur, ph) => `<div class="field-inline">${icon('search', 'sm')}<input type="search" id="f-${key}" data-filter="${key}" value="${esc(cur || '')}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></div>`;
const F = (k, def = '') => UI.f[k] == null ? def : UI.f[k];
const marketsTxt = ids => ids.map(i => market(i).name).join(', ');
const userCell = id => { const u = user(id); return `<div class="row nowrap">${avatar(u, 'sm')}<span>${esc(u.name)}</span></div>`; };
const vtag = v => `<span class="tag">v${v}</span>`;

/* ===== Shell ===== */
const NAV = [
  ['WORKSPACE'], ['home', 'Home', 'home'], ['tasks', 'My Tasks', 'inbox', 'tasks'], ['modules', 'Modules', 'grid'], ['library', 'Approved Library', 'book'], ['assets', 'Assets', 'layers'],
  ['GOVERNANCE'], ['lifecycle', 'Lifecycle', 'clock'], ['audit', 'Audit Trail', 'history'], ['reports', 'Reports', 'chart'],
  ['ADMINISTRATION', 'admin'], ['users', 'Users', 'users', null, 'admin'], ['teams', 'Teams', 'team', null, 'admin'], ['roles', 'Roles', 'key', null, 'admin'], ['products', 'Products', 'pill', null, 'admin'], ['markets', 'Countries & Markets', 'globe', null, 'admin'], ['materials', 'Material Types', 'file', null, 'admin'], ['workflows', 'Workflows', 'workflow', null, 'admin']
];
const NAV_OF = { module: 'modules', 'module-new': 'modules', 'module-edit': 'modules', review: 'tasks', 'asset-review': 'tasks', assemble: 'assets', asset: 'assets', user: 'users', 'user-new': 'users', 'user-edit': 'users', workflow: 'workflows', 'workflow-new': 'workflows' };

function viewShell(inner) {
  const u = me(); const active = NAV_OF[UI.route.name] || UI.route.name; const nTasks = tasksFor(u).length;
  const nav = NAV.map(n => {
    if (n.length <= 2) { if (n[1] === 'admin' && !isAdmin(u)) return ''; return `<div class="nav-label">${n[0]}</div>`; }
    if (n[4] === 'admin' && !isAdmin(u)) return '';
    return `<button class="nav-item ${active === n[0] ? 'active' : ''}" title="${n[1]}" ${goAttr(n[0])} ${active === n[0] ? 'aria-current="page"' : ''}>${icon(n[2])}<span>${n[1]}</span>${n[3] && nTasks ? `<span class="count">${nTasks}</span>` : ''}</button>`;
  }).join('');
  return `<div class="shell">
  <aside class="side" aria-label="Main navigation">
    <button class="brand" ${goAttr('home')} aria-label="SAJA MedLR home"><img src="${LOGO}" alt="SAJA"></button>
    ${nav}
    <div class="spacer"></div>
    <div class="side-user">${avatar(u)}<div style="min-width:0"><b style="font-size:13px;display:block">${esc(u.name)}</b><span class="muted" style="font-size:11.5px">${esc(roleLabel(u))}</span></div></div>
  </aside>
  <div class="main">
    ${viewTopbar(u)}
    <main class="content" id="content">${inner}</main>
  </div>
  </div>`;
}

function viewTopbar(u) {
  const notifs = notificationsFor(u); const unread = notifs.some(n => n.ts > (S.notifSeen || 0));
  return `<header class="topbar">
    <div class="search" id="gsearch">${icon('search', 'sm')}<input id="global-search" type="search" placeholder="Search modules, assets, people…" value="${esc(UI.search)}" aria-label="Search" autocomplete="off">${UI.search ? viewSearchPop() : ''}</div>
    <div class="grow"></div>
    <div class="rel"><button class="btn icon" data-act="pop" data-pop="bell" aria-label="Notifications">${icon('bell')}${unread ? '<span class="bell-dot"></span>' : ''}</button>${UI.pop === 'bell' ? viewNotifPop(notifs) : ''}</div>
    <div class="rel"><button class="userbtn" data-act="pop" data-pop="user" aria-label="Switch demo user">${avatar(u)}<span class="meta"><b>${esc(u.name)}</b><span>${esc(roleLabel(u))}</span></span>${icon('down', 'sm')}</button>${UI.pop === 'user' ? viewUserPop(u) : ''}</div>
  </header>`;
}
function viewUserPop(u) {
  const groups = USER_TYPES.map(t => [t, S.users.filter(x => x.type === t && x.status === 'Active')]);
  return `<div class="pop" role="menu" style="width:330px"><div class="grp">Demo users — view the product as</div>${groups.map(([t, list]) => list.map(x => `<button class="pop-item ${x.id === u.id ? 'on' : ''}" data-act="persona" data-id="${x.id}" role="menuitem">${avatar(x, 'sm')}<span style="flex:1;min-width:0"><b style="font-size:13px;display:block">${esc(x.name)}</b><span class="muted" style="font-size:11.5px">${esc(x.type)}</span></span>${sen(x.seniority)}</button>`).join('')).join('')}
  <div class="grp">Session</div><button class="pop-item" data-act="reset" role="menuitem">${icon('refresh', 'sm')}Reset demo data</button><button class="pop-item" data-act="logout" role="menuitem">${icon('logout', 'sm')}Sign out</button></div>`;
}
function notificationsFor(u) {
  const mine = new Set();
  S.modules.forEach(m => { if (m.owner === u.id || (m.review && canActOn(u, m))) mine.add(m.id); });
  S.assets.forEach(a => { if (a.owner === u.id || (a.review && canActOn(u, a))) mine.add(a.id); });
  return S.audit.filter(e => mine.has(e.objId) && e.user !== u.id).sort((a, b) => b.ts - a.ts).slice(0, 8);
}
function viewNotifPop(list) {
  return `<div class="pop" role="menu"><div class="grp">Notifications</div>${list.length ? list.map(e => { const x = user(e.user); return `<button class="pop-item" ${goAttr(e.objType === 'Asset' ? 'asset' : 'module', e.objId)} role="menuitem">${avatar(x, 'sm')}<span style="flex:1;min-width:0;font-size:12.5px"><b>${esc(x.name)}</b> ${sen(x.seniority)}<br>${esc(e.action)} · ${esc(e.objId)}<br><span class="muted">${ago(e.ts)}</span></span></button>`; }).join('') : '<div class="empty" style="padding:20px">No notifications yet.</div>'}</div>`;
}
function viewSearchPop() {
  const q = UI.search.toLowerCase();
  const mods = S.modules.filter(m => (m.title + ' ' + m.id + ' ' + latest(m).body).toLowerCase().includes(q)).slice(0, 6);
  const as = S.assets.filter(a => (a.name + ' ' + a.id).toLowerCase().includes(q)).slice(0, 4);

  const upcoming = S.modules.filter(m => m.expiry && !m.archived && live(m) && daysTo(m.expiry) <= 120).sort((a, b) => a.expiry - b.expiry);
